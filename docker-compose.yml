version: '3.8'

services:
  rag-app:
    build: .
    container_name: rag-backend
    ports:
      - "8000:8000"
    volumes:
      # 【重点】数据持久化挂载（Volume）
      # 冒号左边 `./chroma_data` 是指：宿主机（你的阿里云服务器）当前目录下的 chroma_data 文件夹。如果没有，Docker 会自动创建。
      # 冒号右边 `/app/chroma_data` 是指：Docker 容器内部的路径。
      # 作用：把服务器上的真实文件夹，和容器内的文件夹“连通”。无论你怎么重启、甚至删除重建容器，你的 Chroma 向量数据都安全地保存在服务器硬盘上，不会丢失。
      - ./chroma_data:/app/chroma_data
      
    restart: always  # 容器如果意外崩溃，或者服务器重启，Docker 会自动帮你重新拉起这个容器
    environment:
      - TZ=Asia/Shanghai # 设置容器内的时区为北京时间，避免日志时间差 8 小时
      - CHROMA_PERSIST_DIR=/app/chroma_data
      # 【未来预留】等你以后项目用到了 MySQL 和 Redis，只需要在这里加上环境变量
      # - MYSQL_HOST=mysql
      # - REDIS_HOST=redis
